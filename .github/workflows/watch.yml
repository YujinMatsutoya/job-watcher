name: Job watcher

on:
  schedule:
    - cron: "0 9 * * *" # UTC; best-effort, so 9-10am UK
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the job if any site fails (GitHub then emails the repo owner).
      - name: Check sites
        run: npm run watch
      # Runs even when a site failed, so healthy sites still save their state.
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update job watcher data [skip ci]"
            git push
          fi
